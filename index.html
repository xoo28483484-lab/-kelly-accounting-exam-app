const KEY='kelly_accounting_app_v1';
const PLAN_START=new Date('2026-09-22T00:00:00');
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{answers:{},uncertain:{},history:[],mockHistory:[],settings:{daily:48}};
let page='home', session=null, mock=null, timerHandle=null;
const app=document.getElementById('app');
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function answeredIds(){return Object.keys(S.answers)}
function statsFor(arr=QUESTIONS){
 let a=0,c=0; arr.forEach(q=>{let x=S.answers[q.id];if(x){a++;if(x.lastCorrect)c++}});
 return {a,c,rate:a?Math.round(c/a*100):0};
}
function wrongQs(){return QUESTIONS.filter(q=>S.answers[q.id] && !S.answers[q.id].lastCorrect)}
function weakScore(q){let x=S.answers[q.id]; if(!x)return 1; return (x.wrong||0)*4+(S.uncertain[q.id]?3:0)-(x.correct||0)}
function todayPlan(){
 const now=new Date(); const day=Math.max(1,Math.floor((now-PLAN_START)/86400000)+1);
 let categoryNo, target;
 if(day<=3){categoryNo=1;target=48}
 else if(day<=7){categoryNo=2;target=60}
 else if(day<=11){categoryNo=3;target=55}
 else if(day<=13){categoryNo=4;target=67}
 else if(day===14){categoryNo=5;target=24}
 else {categoryNo=null;target=60}
 const date=new Date().toISOString().slice(0,10);
 const done=S.history.filter(h=>h.date===date && h.mode==='practice').length;
 return {day,categoryNo,target,done};
}
function setPage(p){page=p;session=null;if(timerHandle)clearInterval(timerHandle);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='home')home(); if(page==='practice')practiceSetup(); if(page==='wrong')wrongPage(); if(page==='mock')mockSetup(); if(page==='stats')statsPage();
}
function levelInfo(){
 const all=statsFor(), coverage=all.a/QUESTIONS.length, mocks=S.mockHistory||[];
 const recent=mocks.slice(-3); const mockRate=recent.length?recent.reduce((a,x)=>a+x.score/80*100,0)/recent.length:0;
 const cats=[1,2,3,4,5].map(i=>statsFor(QUESTIONS.filter(q=>q.categoryNo===i)));
 const coveredCats=cats.filter(x=>x.a>=Math.min(20,Math.max(5,Math.round(x.a*.2)))).length;
 if(coverage>=.8 && all.rate>=85 && recent.length>=2 && mockRate>=80 && coveredCats===5)return {icon:'🏆',name:'穩定應試',note:'題庫與模考表現都很穩定'};
 if(coverage>=.55 && all.rate>=75 && coveredCats>=4)return {icon:'⭐',name:'考試準備中',note:'開始進入整合與模考階段'};
 if(coverage>=.25 && all.rate>=65)return {icon:'🌼',name:'漸入佳境',note:'基礎正在變穩，繼續累積'};
 if(all.a>=20)return {icon:'🌿',name:'基礎建立中',note:'正在建立題感與觀念'};
 return {icon:'🌱',name:'起步',note:'先累積足夠題量，程度會更準'};
}
function home(){
 const st=statsFor(), tp=todayPlan(), w=wrongQs().length, pct=Math.round(st.a/QUESTIONS.length*100), lv=levelInfo();

 const icons=['🧮','📒','🌙','💻','⚖️'];

 <section class="card task section"><div class="taskTop"><div class="taskIcon">🎯</div><div style="flex:1"><span class="pill">W${Math.ceil(tp.day/7)} · Day ${tp.day}</span><div class="taskName">${esc(cat)}</div></div><div style="text-align:right"><b style="font-size:22px">${tp.done}/${tp.target}</b><div class="muted" style="font-size:11px">今日進度</div></div></div><div class="progress" style="margin-top:13px"><i style="width:${Math.min(100,tp.done/tp.target*100)}%"></i></div><button class="primary cta" onclick="startToday()">✏️ ${tp.done?'繼續今日學習':'開始今日學習'}</button></section>
 <h2>五大章節程度</h2><section class="cats section">${cats.map((r,j)=>`<div class="catrow"><div class="catIcon">${icons[j]}</div><div><div class="catname">${esc(r.name)}</div><div class="catbar"><i style="width:${Math.round(r.a/r.total*100)}%"></i></div></div><div class="catpct">${r.a}/${r.total}<br>${r.rate}%</div></div>`).join('')}</section>`;
}
window.startToday=()=>{let tp=todayPlan(); let pool=tp.categoryNo?QUESTIONS.filter(q=>q.categoryNo===tp.categoryNo):QUESTIONS.slice().sort((a,b)=>weakScore(b)-weakScore(a)); startSession(pool,tp.target,'practice')};
function practiceSetup(){
 app.innerHTML=`<h2>學科刷題</h2><div class="card"><label>題組</label><select id="cat">
 <option value="all">全部 762 題</option>${[1,2,3,4,5].map(i=>{let q=QUESTIONS.find(x=>x.categoryNo===i);return `<option value="${i}">${i}. ${esc(q.category)} (${QUESTIONS.filter(x=>x.categoryNo===i).length}題)</option>`}).join('')}</select>
 <br><br><label>本次題數</label><select id="count"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option></select><br><br>
 <div class="row"><button class="primary" onclick="beginPractice(false)">依序／未做優先</button><button class="secondary" onclick="beginPractice(true)">隨機出題</button></div></div>`;
}
window.beginPractice=(random)=>{
 let c=document.getElementById('cat').value, n=+document.getElementById('count').value;
 let pool=c==='all'?QUESTIONS.slice():QUESTIONS.filter(q=>q.categoryNo==c);
 pool.sort((a,b)=>(S.answers[a.id]?1:0)-(S.answers[b.id]?1:0));
 if(random) pool.sort(()=>Math.random()-.5);
 startSession(pool,n,'practice');
}
function startSession(pool,n,mode){
 session={qs:pool.slice(0,Math.min(n,pool.length)),i:0,score:0,mode,locked:false}; renderQuestion();
}
function renderQuestion(){
 let q=session.qs[session.i], uncertain=!!S.uncertain[q.id], p=Math.round((session.i+1)/session.qs.length*100);
 app.innerHTML=`<div class="studyHead"><div class="studyProgress"><span>📚 ${esc(q.category)}</span><span>${session.i+1} / ${session.qs.length}</span></div><div class="progress" style="margin-top:8px"><i style="width:${p}%"></i></div></div>
 <div class="card"><span class="pill">第 ${q.number} 題</span><div class="qtitle" style="margin:12px 0">${esc(q.question)}</div><div id="opts">
 ${q.options.map((o,i)=>`<button class="option" onclick="answer(${i+1},this)"><span class="choiceLetter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="secondary" onclick="toggleUncertain()">${uncertain?'⭐ 已標記':'🤔 不確定／猜的'}</button><button class="secondary" onclick="nextQ()">⏭ 跳過</button></div><div id="feedback"></div></div>`;
}
window.answer=(choice,btn)=>{
 if(session.locked)return; session.locked=true;
 let q=session.qs[session.i], ok=choice===q.answer, rec=S.answers[q.id]||{correct:0,wrong:0,times:0};
 rec.times++; rec.lastChoice=choice; rec.lastCorrect=ok; rec.lastAt=new Date().toISOString(); ok?rec.correct++:rec.wrong++;
 S.answers[q.id]=rec; if(ok)session.score++;
 S.history.push({date:new Date().toISOString().slice(0,10),ts:Date.now(),id:q.id,correct:ok,mode:session.mode});
 save();
 document.querySelectorAll('.option').forEach((b,i)=>{if(i+1===q.answer)b.classList.add('correct'); if(i+1===choice&&!ok)b.classList.add('wrong'); b.disabled=true});
 document.getElementById('feedback').innerHTML=`<p class="${ok?'good':'bad'}"><b>${ok?'答對了':'答錯了'}｜正確答案：${'①②③④'[q.answer-1]}</b></p><button class="primary" onclick="nextQ()">${session.i+1===session.qs.length?'看結果':'下一題'}</button>`;
}
window.toggleUncertain=()=>{let q=session.qs[session.i]; if(S.uncertain[q.id])delete S.uncertain[q.id];else S.uncertain[q.id]=true;save();renderQuestion()}
window.nextQ=()=>{if(session.i+1>=session.qs.length){finishSession()}else{session.i++;session.locked=false;renderQuestion()}}
function finishSession(){
 let total=session.qs.length, score=session.score;
 app.innerHTML=`<h2>本次完成</h2><div class="card"><div class="big">${score}/${total}</div><p>正確率 ${Math.round(score/total*100)}%</p><div class="row"><button class="primary" onclick="setPage('home')">回首頁</button><button class="secondary" onclick="setPage('wrong')">複習錯題</button></div></div>`;
}
function wrongPage(){
 let qs=wrongQs().sort((a,b)=>(S.answers[b.id].wrong||0)-(S.answers[a.id].wrong||0));
 app.innerHTML=`<h2>錯題與不確定題</h2><div class="card"><div class="big">${qs.length}</div><span class="muted">目前最後一次答錯的題目</span><br><br>
 <div class="row"><button class="primary" onclick="reviewWrong()">開始錯題複習</button><button class="secondary" onclick="reviewUncertain()">複習不確定題</button></div></div>
 <div class="card" style="margin-top:12px">${qs.slice(0,50).map(q=>`<div class="listitem"><b>${q.id}｜${esc(q.category)}</b><br>${esc(q.question)}<br><span class="bad">錯 ${S.answers[q.id].wrong||0} 次</span></div>`).join('')||'<span class="muted">目前沒有錯題。</span>'}</div>`;
}
window.reviewWrong=()=>{let q=wrongQs(); if(q.length)startSession(q,Math.min(50,q.length),'review')}
window.reviewUncertain=()=>{let q=QUESTIONS.filter(x=>S.uncertain[x.id]); if(q.length)startSession(q,Math.min(50,q.length),'review')}
function mockSetup(){
 app.innerHTML=`<h2>全真模擬考</h2><div class="card"><p><b>80 題｜100 分鐘</b></p><p class="muted">從 5 大工作項目隨機抽題。模考模式不立即顯示答案，交卷後才計分。</p>
 <button class="primary" onclick="startMock()">開始模擬考</button></div>
 <div class="card" style="margin-top:12px"><b>歷次成績</b>${S.mockHistory.slice().reverse().slice(0,10).map(x=>`<div class="listitem">${x.date}　${x.score}/80　${Math.round(x.score/80*100)}%</div>`).join('')||'<p class="muted">尚無模考紀錄。</p>'}</div>`;
}
window.startMock=()=>{
 let qs=QUESTIONS.slice().sort(()=>Math.random()-.5).slice(0,80);
 mock={qs,i:0,answers:{},started:Date.now(),remaining:100*60}; renderMockQ();
 timerHandle=setInterval(()=>{mock.remaining--;let e=document.getElementById('timer');if(e)e.textContent=fmt(mock.remaining);if(mock.remaining<=0){clearInterval(timerHandle);submitMock()}},1000);
}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderMockQ(){
 let q=mock.qs[mock.i], chosen=mock.answers[q.id];
 app.innerHTML=`<div class="row"><b>第 ${mock.i+1}/80 題</b><span id="timer" class="timer">${fmt(mock.remaining)}</span></div>
 <div class="card" style="margin-top:12px"><div class="qtitle">${esc(q.question)}</div>${q.options.map((o,i)=>`<button class="option ${chosen===i+1?'correct':''}" onclick="mockChoose(${i+1})">${'①②③④'[i]} ${esc(o)}</button>`).join('')}
 <div class="row" style="margin-top:12px"><button class="secondary" onclick="mockMove(-1)">上一題</button><button class="secondary" onclick="mockMove(1)">下一題</button></div><br>
 <button class="primary" onclick="submitMock()">交卷</button></div>`;
}
window.mockChoose=(c)=>{mock.answers[mock.qs[mock.i].id]=c;renderMockQ()}
window.mockMove=(d)=>{mock.i=Math.max(0,Math.min(79,mock.i+d));renderMockQ()}
window.submitMock=()=>{
 if(timerHandle)clearInterval(timerHandle);
 let score=0, wrong=[];
 mock.qs.forEach(q=>{let c=mock.answers[q.id];if(c===q.answer)score++;else wrong.push(q)});
 S.mockHistory.push({date:new Date().toISOString().slice(0,10),score,answered:Object.keys(mock.answers).length});
 wrong.forEach(q=>{let c=mock.answers[q.id]; if(c){let r=S.answers[q.id]||{correct:0,wrong:0,times:0};r.times++;r.wrong++;r.lastChoice=c;r.lastCorrect=false;r.lastAt=new Date().toISOString();S.answers[q.id]=r}});
 save();
 app.innerHTML=`<h2>模擬考結果</h2><div class="card"><div class="big">${score}/80</div><p>正確率 ${Math.round(score/80*100)}%｜未作答 ${80-Object.keys(mock.answers).length} 題</p><button class="primary" onclick="setPage('stats')">查看弱項分析</button></div>`;
}
function statsPage(){
 let rows=[1,2,3,4,5].map(i=>{let arr=QUESTIONS.filter(q=>q.categoryNo===i),x=statsFor(arr);return {i,name:arr[0].category,total:arr.length,...x}}), all=statsFor(),lv=levelInfo(),icons=['🧮','📒','🌙','💻','⚖️'];
 app.innerHTML=`<section class="card hero section"><div class="hello">MY LEVEL</div><h2>${lv.icon} ${lv.name}</h2><p>${lv.note}</p></section><div class="grid section"><div class="card"><div class="big">${all.rate}%</div><span class="muted">總正確率</span></div><div class="card"><div class="big">${all.a}</div><span class="muted">題庫覆蓋</span></div><div class="card"><div class="big">${wrongQs().length}</div><span class="muted">待複習</span></div><div class="card"><div class="big">${S.mockHistory.length}</div><span class="muted">模考次數</span></div></div>
 <h2>🌈 五科能力</h2><section class="cats section">${rows.map((r,j)=>`<div class="catrow"><div class="catIcon">${icons[j]}</div><div><div class="catname">${esc(r.name)}</div><div class="catbar"><i style="width:${Math.round(r.a/r.total*100)}%"></i></div></div><div class="catpct">進度 ${Math.round(r.a/r.total*100)}%<br>正確 ${r.rate}%</div></div>`).join('')}</section>
 <div class="card"><b>☁️ 進度備份</b><p class="muted">換裝置前可先匯出，之後再匯入。</p><div class="row"><button class="secondary" onclick="exportData()">匯出進度</button><button class="secondary" onclick="document.getElementById('imp').click()">匯入進度</button></div><input id="imp" type="file" accept=".json" class="hidden" onchange="importData(this)"></div>`;
}
window.exportData=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kelly_accounting_progress.json';a.click()}
window.importData=(el)=>{let f=el.files[0],r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('進度已匯入')}catch(e){alert('檔案格式錯誤')}};r.readAsText(f)}
render();
</script>
</body></html>
